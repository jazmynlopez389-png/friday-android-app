name: Build FRIDAY APK


on: [push]


jobs:
  build:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Unzip Project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "FRIDAY-AI-Android-Starter*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No zip file found!"
            exit 1
          fi
          echo "Unzipping: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name "settings.gradle*" | head -n 1)")
          echo "Building in $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-App-APK
          path: "**/app-debug.apk"
