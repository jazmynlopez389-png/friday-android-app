name: Build FRIDAY APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Project
        run: unzip -q FRIDAY-AI-Android-Starter.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname $(find project -name "settings.gradle*" | head -n 1))
          echo "Building in $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-App-APK
          path: "**/app-debug.apk"
